<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3a86ff"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecca3"/>
      <stop offset="100%" style="stop-color:#6bf5c2"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#141d2b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(60,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(120,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(180,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(240,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(300,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(360,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(420,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(480,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(540,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(600,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(660,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(720,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(780,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(840,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(900,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(960,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(1020,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(1080,0)"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#fff" stroke-width="1" transform="translate(1140,0)"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,60)"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,120)"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,180)"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,240)"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,300)"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,360)"/>
  </g>

  <!-- Red accent glow top-left -->
  <ellipse cx="80" cy="60" rx="200" ry="150" fill="#e94560" opacity="0.04"/>
  <!-- Blue accent glow bottom-right -->
  <ellipse cx="1100" cy="340" rx="200" ry="150" fill="#3a86ff" opacity="0.04"/>

  <!-- Top border line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#redGlow)"/>

  <!-- Shield icon -->
  <g transform="translate(70, 55)">
    <path d="M40 8 L72 22 L72 50 C72 72 58 90 40 98 C22 90 8 72 8 50 L8 22 Z"
          fill="none" stroke="url(#redGlow)" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M40 18 L64 28 L64 48 C64 65 53 78 40 84 C27 78 16 65 16 48 L16 28 Z"
          fill="#e94560" opacity="0.12"/>
    <!-- Lock/target crosshair inside shield -->
    <circle cx="40" cy="48" r="12" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.8"/>
    <circle cx="40" cy="48" r="4" fill="#e94560" opacity="0.9"/>
    <line x1="40" y1="32" x2="40" y2="38" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="58" x2="40" y2="64" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
    <line x1="24" y1="48" x2="30" y2="48" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="48" x2="56" y2="48" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Main title: RHEL-RT -->
  <text x="160" y="100" font-family="'SF Mono','Fira Code','Cascadia Code','Consolas',monospace" font-size="56" font-weight="900" letter-spacing="3">
    <tspan fill="url(#redGlow)" filter="url(#glow)">RHEL</tspan>
    <tspan fill="#4a5568">-</tspan>
    <tspan fill="url(#redGlow)" filter="url(#glow)">RT</tspan>
  </text>

  <!-- Subtitle -->
  <text x="162" y="132" font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif" font-size="17" fill="#8b949e" letter-spacing="5" font-weight="400">
    RED TEAM SECURITY SCANNER
  </text>

  <!-- Divider -->
  <line x1="160" y1="150" x2="560" y2="150" stroke="#e94560" stroke-width="1" opacity="0.3"/>

  <!-- Description -->
  <text x="162" y="178" font-family="'Inter','Segoe UI',sans-serif" font-size="14.5" fill="#c9d1d9" letter-spacing="0.3">
    MITRE ATT&amp;CK-aligned security validation for Red Hat Enterprise Linux
  </text>

  <!-- Stat cards -->
  <!-- Card 1: Modules -->
  <rect x="160" y="205" width="150" height="70" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <text x="235" y="236" font-family="'SF Mono','Fira Code',monospace" font-size="28" fill="#e94560" font-weight="700" text-anchor="middle" filter="url(#glow)">108</text>
  <text x="235" y="258" font-family="'Inter','Segoe UI',sans-serif" font-size="10" fill="#8b949e" text-anchor="middle" letter-spacing="1.5" font-weight="500">MODULES</text>

  <!-- Card 2: Tactics -->
  <rect x="325" y="205" width="150" height="70" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="236" font-family="'SF Mono','Fira Code',monospace" font-size="28" fill="#3a86ff" font-weight="700" text-anchor="middle">9</text>
  <text x="400" y="258" font-family="'Inter','Segoe UI',sans-serif" font-size="10" fill="#8b949e" text-anchor="middle" letter-spacing="1.5" font-weight="500">TACTICS</text>

  <!-- Card 3: Frameworks -->
  <rect x="490" y="205" width="150" height="70" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <text x="565" y="236" font-family="'SF Mono','Fira Code',monospace" font-size="28" fill="#4ecca3" font-weight="700" text-anchor="middle">3</text>
  <text x="565" y="258" font-family="'Inter','Segoe UI',sans-serif" font-size="10" fill="#8b949e" text-anchor="middle" letter-spacing="1.5" font-weight="500">COMPLIANCE</text>

  <!-- Tactic coverage bar -->
  <text x="162" y="310" font-family="'Inter','Segoe UI',sans-serif" font-size="10" fill="#6e7681" letter-spacing="1.5" font-weight="500">ATT&amp;CK COVERAGE</text>

  <!-- Coverage pills -->
  <g transform="translate(160, 320)">
    <!-- Active tactics (green) -->
    <rect x="0" y="0" width="52" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="26" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">DISC</text>

    <rect x="60" y="0" width="52" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="86" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">CRED</text>

    <rect x="120" y="0" width="52" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="146" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">PRIV</text>

    <rect x="180" y="0" width="52" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="206" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">EXEC</text>

    <rect x="240" y="0" width="52" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="266" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">PERS</text>

    <rect x="300" y="0" width="52" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="326" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">EVAS</text>

    <rect x="360" y="0" width="52" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="386" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">LATR</text>

    <rect x="420" y="0" width="38" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="439" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">C2</text>

    <rect x="466" y="0" width="52" height="22" rx="4" fill="#4ecca3" opacity="0.15" stroke="#4ecca3" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="492" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#4ecca3" text-anchor="middle" font-weight="600">EXFL</text>

    <!-- Planned tactics (dim) -->
    <rect x="526" y="0" width="52" height="22" rx="4" fill="#fff" opacity="0.03" stroke="#30363d" stroke-width="0.5"/>
    <text x="552" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#484f58" text-anchor="middle" font-weight="600">COLL</text>

    <rect x="586" y="0" width="46" height="22" rx="4" fill="#fff" opacity="0.03" stroke="#30363d" stroke-width="0.5"/>
    <text x="609" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#484f58" text-anchor="middle" font-weight="600">INIT</text>

    <rect x="640" y="0" width="52" height="22" rx="4" fill="#fff" opacity="0.03" stroke="#30363d" stroke-width="0.5"/>
    <text x="666" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#484f58" text-anchor="middle" font-weight="600">IMPT</text>
  </g>

  <!-- Badge row -->
  <g transform="translate(160, 362)">
    <!-- Python badge -->
    <rect x="0" y="0" width="90" height="22" rx="4" fill="#1f2937"/>
    <rect x="0" y="0" width="48" height="22" rx="4" fill="#3572A5"/>
    <text x="24" y="15" font-family="'Inter',sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">Python</text>
    <text x="69" y="15" font-family="'Inter',sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">3.10+</text>

    <!-- License badge -->
    <rect x="100" y="0" width="68" height="22" rx="4" fill="#1f2937"/>
    <rect x="100" y="0" width="38" height="22" rx="4" fill="#e94560"/>
    <text x="119" y="15" font-family="'Inter',sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">MIT</text>
    <text x="148" y="15" font-family="'Inter',sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">license</text>

    <!-- ATT&CK badge -->
    <rect x="178" y="0" width="108" height="22" rx="4" fill="#1f2937"/>
    <rect x="178" y="0" width="58" height="22" rx="4" fill="#e94560"/>
    <text x="207" y="15" font-family="'Inter',sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">ATT&amp;CK</text>
    <text x="247" y="15" font-family="'Inter',sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">v16</text>

    <!-- RHEL badge -->
    <rect x="296" y="0" width="100" height="22" rx="4" fill="#1f2937"/>
    <rect x="296" y="0" width="42" height="22" rx="4" fill="#cc0000"/>
    <text x="317" y="15" font-family="'Inter',sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">RHEL</text>
    <text x="357" y="15" font-family="'Inter',sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">8 &amp; 9</text>
  </g>

  <!-- Right side: terminal mockup -->
  <g transform="translate(720, 50)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="430" height="300" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="430" height="32" rx="10" fill="#161b22"/>
    <rect x="0" y="22" width="430" height="10" fill="#161b22"/>
    <!-- Traffic lights -->
    <circle cx="18" cy="16" r="5.5" fill="#ff5f57"/>
    <circle cx="36" cy="16" r="5.5" fill="#febc2e"/>
    <circle cx="54" cy="16" r="5.5" fill="#28c840"/>
    <!-- Title text -->
    <text x="215" y="20" font-family="'Inter',sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">rhel-rt scan</text>

    <!-- Terminal content -->
    <g transform="translate(16, 48)">
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11.5" fill="#8b949e">
        <tspan x="0" y="0" fill="#8b949e">$</tspan>
        <tspan fill="#c9d1d9"> python main.py scan \</tspan>
        <tspan x="12" y="18" fill="#c9d1d9">--target</tspan>
        <tspan fill="#a5d6ff"> 192.168.1.20</tspan>
        <tspan fill="#c9d1d9"> \</tspan>
        <tspan x="12" y="36" fill="#c9d1d9">--profile</tspan>
        <tspan fill="#a5d6ff"> full</tspan>
      </text>

      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="66">
        <tspan x="0" fill="#4ecca3">&#10003;</tspan>
        <tspan fill="#8b949e"> Loaded </tspan>
        <tspan fill="#e94560">108</tspan>
        <tspan fill="#8b949e"> modules across </tspan>
        <tspan fill="#3a86ff">9</tspan>
        <tspan fill="#8b949e"> tactics</tspan>
      </text>

      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="86">
        <tspan x="0" fill="#4ecca3">&#10003;</tspan>
        <tspan fill="#8b949e"> Connected to </tspan>
        <tspan fill="#a5d6ff">192.168.1.20</tspan>
        <tspan fill="#8b949e"> via SSH</tspan>
      </text>

      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="106">
        <tspan x="0" fill="#4ecca3">&#10003;</tspan>
        <tspan fill="#8b949e"> Detected </tspan>
        <tspan fill="#a5d6ff">RHEL 9.3</tspan>
        <tspan fill="#8b949e"> (5.14.0-362.el9)</tspan>
      </text>

      <!-- Scanning animation -->
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="134">
        <tspan x="0" fill="#3a86ff">&#9656;</tspan>
        <tspan fill="#c9d1d9"> Scanning T1082 System Information...</tspan>
      </text>

      <!-- Results -->
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="162">
        <tspan x="0" fill="#8b949e">  Results:</tspan>
      </text>
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="180">
        <tspan x="0" fill="#e94560">  &#9679; 23 VULNERABLE</tspan>
        <tspan x="140" fill="#4ecca3">&#9679; 71 SECURE</tspan>
      </text>
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="198">
        <tspan x="0" fill="#f0c040">  &#9679;  6 ERRORS</tspan>
        <tspan x="140" fill="#6e7681">&#9679;  8 SKIPPED</tspan>
      </text>

      <!-- Report line -->
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="226">
        <tspan x="0" fill="#4ecca3">&#10003;</tspan>
        <tspan fill="#8b949e"> Report: </tspan>
        <tspan fill="#a5d6ff">reports/scan_a3f1.html</tspan>
      </text>
      <text font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" y="244">
        <tspan x="0" fill="#4ecca3">&#10003;</tspan>
        <tspan fill="#8b949e"> ATT&amp;CK layer: </tspan>
        <tspan fill="#a5d6ff">attack_layer_a3f1.json</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="397" width="1200" height="3" fill="url(#blueGlow)" opacity="0.5"/>
</svg>
